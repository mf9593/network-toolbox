name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 不再使用 android-actions/setup-android@v3：
      # 它在新版 runner 上会执行 `sdkmanager tools`，而 `tools` 包已从 SDK 仓库移除，
      # 导致 "Failed to find package 'tools'" 构建直接失败。
      # ubuntu-latest 已预装 Android SDK（ANDROID_HOME=/usr/local/lib/android/sdk），
      # 这里只补一步接受许可即可。
      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null | tail -5

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-configuration-cache --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: network-toolbox-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
