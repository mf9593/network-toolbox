name: Release APK

# 自动发版：构建 debug APK 并上传到 GitHub Release
# 全程只使用 GitHub 自带的 GITHUB_TOKEN（下方 permissions 已声明 contents: write），
# 不需要手工创建 Personal Access Token。
#
# 使用方式（二选一）：
#   1. 网页：Actions → Release APK → Run workflow，填 tag（默认 v2.1.0）
#   2. 打标签：git tag v2.1.1 && git push origin v2.1.1
#
# 注意：debug 包使用仓库 Secret `DEBUG_KEYSTORE_B64` 里的签名证书，
# 必须是同一份 debug.keystore，否则已安装用户无法覆盖升级（签名不一致）。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签（已存在则替换资产，不存在则新建 Release）'
        required: true
        default: 'v2.1.0'
      prerelease:
        description: '标记为预发布（不推荐，应用内更新只读 latest）'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 与 android-build.yml 保持一致：ubuntu-latest 已预装 Android SDK，只补许可
      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi

      # 恢复仓库作者的 debug 签名证书，保证与已发布 APK 签名一致（可覆盖升级）
      - name: Restore debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::缺少仓库 Secret：DEBUG_KEYSTORE_B64。"
            echo "请把本地 debug.keystore 用 base64 -w0 生成的单行文本存为该 Secret，否则签名不一致会导致无法覆盖安装。"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          echo "$KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android | grep -i androiddebugkey

      - name: Read version
        id: ver
        run: |
          VERSION_NAME=$(grep -m1 'versionName' app/build.gradle | sed 's/.*versionName[[:space:]]*["'\'']\([^"'\'']*\)["'\''].*/\1/')
          VERSION_CODE=$(grep -m1 'versionCode' app/build.gradle | sed 's/.*versionCode[[:space:]]*\([0-9]*\).*/\1/')
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "版本: $VERSION_NAME ($VERSION_CODE)"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-configuration-cache --stacktrace

      - name: Verify signature and collect APK
        id: apk
        run: |
          SRC=app/build/outputs/apk/debug/app-debug.apk
          OUT="network-toolbox-${{ steps.ver.outputs.name }}.apk"
          cp "$SRC" "$OUT"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs "$OUT" | grep -i 'SHA-256' | head -1
          sha256sum "$OUT" | tee sha256.txt
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          FILE="${{ steps.apk.outputs.file }}"
          VER="${{ steps.ver.outputs.name }}"

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG 已存在，替换资产"
            gh release upload "$TAG" "$FILE" --clobber
          else
            echo "新建 Release $TAG"
            PRERELEASE=""
            if [ "${{ inputs.prerelease }}" = "true" ]; then PRERELEASE="--prerelease"; fi
            gh release create "$TAG" "$FILE" \
              --title "网络工具箱 $TAG" \
              --notes "版本 $VER（版本号 ${{ steps.ver.outputs.code }}），构建时间 $(date -u '+%Y-%m-%d %H:%M UTC')。" \
              --target "${{ github.sha }}" \
              $PRERELEASE
          fi

          gh release view "$TAG" --json tagName,assets --jq '.tagName, (.assets[] | "\(.name)  \(.size) 字节")'
