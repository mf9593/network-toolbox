name: Release APK

# 自动发版：构建 debug APK 并上传到 GitHub Release
# 全程只使用 GitHub 自带的 GITHUB_TOKEN（下方 permissions 已声明 contents: write），
# 不需要手工创建 Personal Access Token。
#
# 使用方式（二选一）：
#   1. 网页：Actions → Release APK → Run workflow，填 tag（默认 v2.1.0）
#   2. 打标签：git tag v2.1.1 && git push origin v2.1.1
#
# 注意：debug 包使用仓库 Secret `DEBUG_KEYSTORE_B64` 里的签名证书，
# 必须是同一份 debug.keystore，否则已安装用户无法覆盖升级（签名不一致）。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签（已存在则替换资产，不存在则新建 Release）'
        required: true
        default: 'v2.1.0'
      prerelease:
        description: '标记为预发布（不推荐，应用内更新只读 latest）'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 与 android-build.yml 保持一致：ubuntu-latest 已预装 Android SDK，只补许可
      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi

      # 恢复仓库作者的 debug 签名证书，保证与已发布 APK 签名一致（可覆盖升级）
      # 拆成三步，失败时能一眼看出是「没配 Secret」「不是 base64」还是「keystore 不对」
      - name: 1/3 检查 Secret 是否存在
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret DEBUG_KEYSTORE_B64 为空或不存在。"
            echo "请到 Settings → Secrets and variables → Actions 的 **Repository secrets** 添加（不是 Variables，也不是 Environment secrets）。"
            exit 1
          fi
          echo "Secret 字符数：${#KEYSTORE_B64}"

      - name: 2/3 解码 keystore
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p "$HOME/.android"
          # 容错：去掉可能被复制进来的回车/换行/制表符，并把 URL-safe base64 转回标准 base64
          VALUE=$(printf '%s' "$KEYSTORE_B64" | tr -d '\r\n\t' | tr '_-' '/+')
          if ! printf '%s' "$VALUE" | base64 -d -i > "$HOME/.android/debug.keystore" 2>/dev/null \
             || [ ! -s "$HOME/.android/debug.keystore" ]; then
            echo "::error::Secret 内容不是合法 base64。"
            echo "请在本地执行 base64 -w0 ~/.android/debug.keystore，把输出的单行文本原样贴进 Secret（不要加引号、不要带路径、不要换行）。"
            exit 1
          fi
          chmod 600 "$HOME/.android/debug.keystore"
          ls -l "$HOME/.android/debug.keystore"
          echo "文件头 4 字节（JKS 为 fe ed fe ed）：$(xxd -p -l 4 "$HOME/.android/debug.keystore")"

      - name: 3/3 校验 keystore 与证书指纹
        run: |
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android || {
            echo "::error::keystore 打不开，确认 Secret 里是 debug.keystore 本身（密码默认 android）。"
            exit 1
          }
          ACTUAL=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android \
            | grep -i 'SHA256:' | head -1 | sed 's/.*SHA256:[[:space:]]*//')
          echo "证书 SHA-256：$ACTUAL"
          EXPECTED="C2:0A:82:84:6A:A0:0F:59:4B:D7:C9:F7:45:B8:B1:10:B8:6C:CB:39:E0:A2:F9:9A:18:4B:F9:15:80:A9:E3:F7"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::warning::证书指纹与已发布包（$EXPECTED）不一致，已安装用户无法覆盖升级。"
          fi

      - name: Read version
        id: ver
        run: |
          VERSION_NAME=$(grep -m1 'versionName' app/build.gradle | sed 's/.*versionName[[:space:]]*["'\'']\([^"'\'']*\)["'\''].*/\1/')
          VERSION_CODE=$(grep -m1 'versionCode' app/build.gradle | sed 's/.*versionCode[[:space:]]*\([0-9]*\).*/\1/')
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "版本: $VERSION_NAME ($VERSION_CODE)"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-configuration-cache --stacktrace

      - name: Verify signature and collect APK
        id: apk
        run: |
          SRC=app/build/outputs/apk/debug/app-debug.apk
          OUT="network-toolbox-${{ steps.ver.outputs.name }}.apk"
          cp "$SRC" "$OUT"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs "$OUT" | grep -i 'SHA-256' | head -1
          sha256sum "$OUT" | tee sha256.txt
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          FILE="${{ steps.apk.outputs.file }}"
          VER="${{ steps.ver.outputs.name }}"

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG 已存在，替换资产"
            gh release upload "$TAG" "$FILE" --clobber
          else
            echo "新建 Release $TAG"
            PRERELEASE=""
            if [ "${{ inputs.prerelease }}" = "true" ]; then PRERELEASE="--prerelease"; fi
            gh release create "$TAG" "$FILE" \
              --title "网络工具箱 $TAG" \
              --notes "版本 $VER（版本号 ${{ steps.ver.outputs.code }}），构建时间 $(date -u '+%Y-%m-%d %H:%M UTC')。" \
              --target "${{ github.sha }}" \
              $PRERELEASE
          fi

          gh release view "$TAG" --json tagName,assets --jq '.tagName, (.assets[] | "\(.name)  \(.size) 字节")'
