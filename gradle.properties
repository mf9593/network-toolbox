# =============================================================================
# 网络工具箱项目 Gradle 配置
# =============================================================================
# 
# 此文件配置 Gradle 构建环境和 Android 构建选项。
# IDE (如 Android Studio) 中的设置可能会覆盖此文件中的配置。
# 
# 详细配置说明: http://www.gradle.org/docs/current/userguide/build_environment.html
# =============================================================================

# -----------------------------------------------------------------------------
# JVM 配置
# -----------------------------------------------------------------------------
# Gradle Daemon 进程的 JVM 参数
# -Xmx4096m: 最大堆内存 4GB，用于加速大型项目构建
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# -----------------------------------------------------------------------------
# Android 配置
# -----------------------------------------------------------------------------
# 使用 AndroidX 支持库替代旧版 Support Library
# AndroidX 是 Android 支持库的现代化版本，包名更清晰
android.useAndroidX=true

# Kotlin 代码风格配置 (官方推荐)
kotlin.code.style=official

# 启用非传递性 R 类
# 每个 library 模块的 R 类只包含该模块自身声明的资源
# 优点: 减小 R 类大小，提升构建速度
android.nonTransitiveRClass=true

# -----------------------------------------------------------------------------
# Gradle 性能优化配置
# -----------------------------------------------------------------------------
# 启用构建缓存
# 缓存编译产物，增量构建时复用，显著提升构建速度
org.gradle.caching=true

# 启用并行构建
# 多模块项目可并行构建，缩短总体构建时间
# 注意: 需要模块间解耦才能正常工作
org.gradle.parallel=true

# 启用配置缓存 (Gradle 8.x 特性)
# 缓存任务配置结果，避免每次构建重新配置
# 可显著缩短配置阶段时间
org.gradle.configuration-cache=true


# -----------------------------------------------------------------------------
# GitHub 开源仓库（用于关于页和检查更新）
# -----------------------------------------------------------------------------
# 格式：owner/仓库名。填写后重新构建 APK。
# 当前：mf9593
github.owner=mf9593
github.repo=network-toolbox
